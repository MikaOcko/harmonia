name: Intégration continue pour le backend
on: 
  push:
    branches: [feat/ci-violaine]

jobs:
  backend :
    runs-on: ubuntu-latest
    environment: ci
    env:
      # DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL: "mysql://root:root@127.0.0.1:3506/harmonia?serverVersion=10.6.0-MariaDBcharset=utf8mb4"
      ES_HOST: "localhost"
      ES_PORT: "8000"
    services:
      mysql:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER_PASSWORD: root
        ports:
          - 3506:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
          --health-start-period=10s

    steps:
    - name: checkout github
      uses: actions/checkout@v7
    - name: PHP installation
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, dom, filter, gd, iconv, json, mbstring
    # - name: check PHP version
    #   run: php -v
    - name: dependencies installation
      run: composer install --prefer-dist --no-interaction
    - name: linter on templates
      run: php bin/console lint:twig templates
    - name: PHPstan
      run: vendor/bin/phpstan analyse src --level=3
    - name: CS fixer
      run: vendor/bin/php-cs-fixer fix --dry-run --diff

    - name: database creation
      run: php bin/console doctrine:database:create --if-not-exists --env=test
    - name: database migration
      run: php bin/console doctrine:migrations:migrate --no-interaction --env=test
    - name: fixtures migration
      run: php bin/console doctrine:fixtures:load --env=test

    - name: Run functionnal and unit tests
      run: vendor/bin/phpunit tests/HomeControllerTest.php


   
